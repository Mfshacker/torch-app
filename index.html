<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Question 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">
        <div class="card">

            <div class="heart">💗</div>

            <h1>Do you want to go out with me?</h1>

            <p class="subtitle">
                I have a very important question for you... 👀
            </p>

            <div class="buttons">
                <button id="yesBtn" class="yes-btn">
                    Yes 💕
                </button>

                <button id="noBtn" class="no-btn">
                    No 😭
                </button>
            </div>

            <p class="hint">
                Choose wisely... 😌
            </p>

        </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
